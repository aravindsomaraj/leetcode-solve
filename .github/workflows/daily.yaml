name: LeetCode Daily

on:
  schedule:
    - cron: '17 0,1 * * *'
  workflow_dispatch:
    inputs:
      test_notifications:
        description: 'Send test alerts only (do not run the solver)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leetcode-daily
  cancel-in-progress: false

jobs:
  solve:
    if: github.ref_name == github.event.repository.default_branch && inputs.test_notifications != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest -v
      - name: Load non-secret defaults
        run: cp config.example.json config.json
      - name: Solve, test and submit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          GH_STATE_TOKEN: ${{ github.token }}
        run: python bot.py run
      - name: Show final status
        if: always()
        run: python bot.py status

  notify-failure:
    if: ${{ always() && github.ref_name == github.event.repository.default_branch && (needs.solve.result == 'failure' || inputs.test_notifications == true) }}
    needs: solve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Send email and phone alerts
        env:
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_NTFY_URL: ${{ secrets.ALERT_NTFY_URL }}
          ALERT_NTFY_TOKEN: ${{ secrets.ALERT_NTFY_TOKEN }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_TEST_MODE: ${{ inputs.test_notifications }}
        run: python .github/scripts/notify_failure.py
